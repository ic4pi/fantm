# Supabase pauses a free-tier database after 7 days with no activity, and
# the API can't start without it. Once a day, call the API's health check:
# it wakes the Render instance and runs a real query against the database,
# which counts as activity. A failed run emails the repo owner, so a pause
# that happens anyway gets noticed (a paused database has to be restored
# from the Supabase dashboard; a ping can't wake it).
name: Keep backend and database awake

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ping API health check
        run: |
          for attempt in 1 2 3 4; do
            body=$(curl -sS --max-time 90 https://jeremy-f-wall--fantm-web.us-east.modal.run/api/health || true)
            echo "attempt $attempt: $body"
            if echo "$body" | grep -q '"database":"ok"'; then
              echo "Backend and database are awake."
              exit 0
            fi
            sleep 20
          done
          echo "::error::Health check never reported the database as ok. If Supabase paused the project, restore it from the Supabase dashboard."
          exit 1
